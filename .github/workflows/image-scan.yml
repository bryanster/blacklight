# Blacklight — weekly vulnerability scan of the published image.
#
# The release workflow scans nothing: it pushes ghcr.io/bryanster/blacklight
# and moves on. New CVEs are published against base-image packages every week,
# so an image that was clean on release day does not stay clean. This job
# re-scans :latest on a schedule and reports what it finds to the repository's
# Security tab (code scanning), where each finding is tracked and closed.
#
# It does not fail on findings. A failing scheduled run only says "something
# is wrong" in an email; the code-scanning alerts say what, and stay open until
# a release fixes them. The job summary lists the HIGH/CRITICAL ones that have
# a fix available, which are the ones a rebuild or bump can act on.
#
# Both architectures are scanned: the runtime stage installs packages per
# platform, so arm64 can carry a different package set from amd64.

name: Image scan

on:
  schedule:
    - cron: '23 6 * * 1'  # Mondays 06:23 UTC
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to scan
        default: latest
        required: false

permissions:
  contents: read
  packages: read         # pull from GHCR
  security-events: write # upload SARIF to code scanning

concurrency:
  group: image-scan
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bryanster/blacklight:${{ inputs.tag || 'latest' }}

jobs:
  scan:
    name: Scan linux/${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pulled explicitly so the scan is of one platform and the digest it
      # scanned is recorded in the summary.
      - name: Pull the image
        id: pull
        run: |
          docker pull --platform "linux/${{ matrix.arch }}" "${IMAGE}"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE}")"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Full report for code scanning: every severity, unfixed included, so
      # the Security tab is the complete picture.
      - name: Scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          # The action pins an older default Trivy; keep this on the latest release.
          version: v0.76.1
          format: sarif
          output: trivy-${{ matrix.arch }}.sarif
          exit-code: '0'
        env:
          TRIVY_PLATFORM: linux/${{ matrix.arch }}

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-${{ matrix.arch }}.sarif
          category: image-linux-${{ matrix.arch }}

      # Readable summary: only what is both serious and fixable.
      - name: Scan (summary)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          output: trivy-${{ matrix.arch }}.txt
          exit-code: '0'
          skip-setup-trivy: true
        env:
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
          TRIVY_SKIP_DB_UPDATE: true

      - name: Write the job summary
        run: |
          {
            echo "### linux/${{ matrix.arch }}"
            echo "Scanned \`${{ steps.pull.outputs.digest }}\`"
            echo
            echo "HIGH/CRITICAL with a fix available:"
            echo '```'
            cat trivy-${{ matrix.arch }}.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
