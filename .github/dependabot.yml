# Dependency updates, batched into one pull request per ecosystem per month.
#
# Grouped rather than one PR per package: an ungrouped Go tree here opens a
# dozen PRs a month, each of which has to pass the same eight-minute pipeline,
# and the review that matters (does the suite still pass) is identical for all
# of them. `cooldown` holds a release for a week so a bad publish is yanked
# before it reaches a branch here.
#
# The github-actions ecosystem is the one that keeps the SHA pins in
# .github/workflows/ci.yml current — Dependabot rewrites both the SHA and the
# `# vX.Y.Z` comment beside it, which is the only sustainable way to run
# commit-pinned actions.

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      go-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
    pull-request-branch-name:
      separator: "/"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "go"

  # web/, not the repository root: package.json lives with the SPA.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      # Split so a routine patch bump is not held up by a major React or Vite
      # release, which needs a human to read the migration notes.
      npm-development:
        dependency-type: "development"
        patterns:
          - "*"
      npm-production:
        dependency-type: "production"
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
    pull-request-branch-name:
      separator: "/"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "javascript"

  # The Playwright suite is a third npm project (M0B-013). Ungrouped from web/
  # on purpose: a Playwright bump usually needs its browsers redownloaded and is
  # worth reading on its own, and it must never be able to hold up a security
  # patch for the SPA.
  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      e2e-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
    pull-request-branch-name:
      separator: "/"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "javascript"

  # The Azure deployment example (deploy/azure-terraform/). Dependabot bumps the
  # `required_providers` constraints in main.tf and regenerates the committed
  # .terraform.lock.hcl, which is what pins the provider hashes for anyone who
  # runs the example.
  - package-ecosystem: "terraform"
    directory: "/deploy/azure-terraform"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      terraform-providers:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
    pull-request-branch-name:
      separator: "/"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "terraform"

  # The base images in deploy/Dockerfile, which are pinned by digest so that
  # this can see them (the comment above their FROM lines explains why).
  # Weekly rather than monthly: Debian and the official images are rebuilt
  # for security fixes far more often than once a month, and those rebuilds
  # are most of what the image scan reports. One grouped PR, because the three
  # stages must move together on the same Debian release. Major bumps (Node
  # 26, a new Debian codename) are left for a human, since they change the
  # glibc or the toolchain rather than patch it.
  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      docker-base-images:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
    pull-request-branch-name:
      separator: "/"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
    pull-request-branch-name:
      separator: "/"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "ci"
